CONFIG_LOG=y
CONFIG_PWM=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y

# Bluetooth: broadcaster only (advertising is non-connectable)
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="prst"
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_BROADCASTER=y

# Logging: straight to RTT, no queue and no log thread
CONFIG_SERIAL=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
CONFIG_MAIN_STACK_SIZE=1536

CONFIG_ASSERT=y

# Application config - see all options in Kconfig.
# CONFIG_PRST_BLE_ENCODING_BTHOME_V2=y
CONFIG_PRST_SLEEP_DURATION_MSEC=1000

# prstlib config - see all options in prstlib/Kconfig.
CONFIG_PRSTLIB_LOG_LEVEL_DBG=y